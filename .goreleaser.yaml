version: 2

project_name: tabularium

before:
  hooks:
    - go mod tidy

builds:
  - id: tabularium
    main: ./cmd/tabularium
    binary: tabularium
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sgaunet/tabularium/internal/cli.Version={{ .Version }}
      - -X github.com/sgaunet/tabularium/internal/cli.Commit={{ .Commit }}
      - -X github.com/sgaunet/tabularium/internal/cli.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"


homebrew_casks:
  - name: tabularium
    homepage: "https://github.com/sgaunet/tabularium"
    description: "Read scanned documents and file them under meaningful names"
    directory: Casks
    binaries:
      - tabularium
    # No shell completions: tabularium has no subcommands (Principle I), so
    # there is no `completion` command to generate them from. Leaving the
    # cobra-shaped block here produced a cask whose install step ran
    # `tabularium completion bash` and got exit 2.
    # Unsigned binaries are quarantined by macOS Gatekeeper; strip the attribute.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end
    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com
    repository:
      owner: sgaunet
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"


