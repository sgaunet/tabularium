name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install poppler-utils (pdftotext, pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: task test
